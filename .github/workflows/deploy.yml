name: Deploy Config and GCP Workflow

on:
  push:
    branches:
      - main  # Change to your default branch name if needed

# Define project ID globally or at the job level
env:
  GCP_PROJECT_ID: mtv-2026  # Replace with your actual GCP Project ID

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0.a Validate JSON syntax before doing anything else
      - name: Validate JSON Syntax
        run: |
          jq . algorithm-target.json

      # 0.b Also validate JSON file to make sure no missing fields
      - name: Validate business rules
        run: |
          python .github/workflows/validate_config.py

      # 1. Authenticate to GCP using the Service Account JSON Key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.zhai_spark }}

      # 2. Set up gcloud SDK CLI tool
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Copy JSON file to Cloud Storage bucket
      - name: Upload Config to GCS
        run: |
          gcloud storage cp algorithm-target.json gs://xumo-dataproc-serverless2/algorithm-target-config/algorithm-target.json

      # 4. Deploy or Update GCP Workflow
      - name: Deploy GCP Workflow
        run: |
          gcloud workflows deploy from-github-action-test-gcs_read \
            --source=test_gcs_read.yml \
            --location=us-central1 \
            --description="this is a test workflow" \
            --service-account=elx-dataproc-batch@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --call-log-level=log-all-calls
